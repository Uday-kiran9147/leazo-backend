┌─────────────────────────────────────────────────────────────────────────────────────────┐
│                         COMPLETE SUBSCRIPTION PAYMENT FLOW                              │
└─────────────────────────────────────────────────────────────────────────────────────────┘

┌──────────────┐         ┌──────────────┐         ┌──────────────┐         ┌──────────────┐
│   FLUTTER    │         │   NODE.JS    │         │   RAZORPAY   │         │   MONGODB    │
│   (Mobile)   │         │   (Backend)  │         │   (Gateway)  │         │   (Database) │
└──────┬───────┘         └──────┬───────┘         └──────┬───────┘         └──────┬───────┘
       │                        │                        │                        │
       │  ══════════════════════════════════════════════════════════════════════  │
       │                    PHASE 1: CREATE SUBSCRIPTION                          │
       │  ══════════════════════════════════════════════════════════════════════  │
       │                        │                        │                        │
       │ 1. User selects plan   │                        │                        │
       │    (owner_pro)         │                        │                        │
       │────────────────────────>                        │                        │
       │ POST /razorpay/subscription                     │                        │
       │ {planId, email, name}  │                        │                        │
       │                        │                        │                        │
       │                        │ 2. Create payment      │                        │
       │                        │    record              │                        │
       │                        │────────────────────────────────────────────────>│
       │                        │                        │   PaymentEntity.create │
       │                        │                        │   status: "initiated"  │
       │                        │                        │                        │
       │                        │ 3. Create subscription │                        │
       │                        │────────────────────────>                        │
       │                        │ razorpay.subscriptions │                        │
       │                        │ .create({plan_id})     │                        │
       │                        │                        │                        │
       │                        │<───────────────────────│                        │
       │                        │ {subscription_id,      │                        │
       │                        │  short_url, status}    │                        │
       │                        │                        │                        │
       │                        │ 4. Update payment      │                        │
       │                        │    with subscription_id│                        │
       │                        │────────────────────────────────────────────────>│
       │                        │                        │                        │
       │<───────────────────────│                        │                        │
       │ {subscriptionId,       │                        │                        │
       │  key: rzp_xxx}         │                        │                        │
       │                        │                        │                        │
       │  ══════════════════════════════════════════════════════════════════════  │
       │                    PHASE 2: RAZORPAY CHECKOUT                            │
       │  ══════════════════════════════════════════════════════════════════════  │
       │                        │                        │                        │
       │ 5. Open Razorpay       │                        │                        │
       │    Checkout UI         │                        │                        │
       │ ┌────────────────────┐ │                        │                        │
       │ │ ┌────────────────┐ │ │                        │                        │
       │ │ │  RAZORPAY SDK  │ │ │                        │                        │
       │ │ │                │ │ │                        │                        │
       │ │ │  Pay ₹199/mo   │ │─────────────────────────>│                        │
       │ │ │                │ │ │                        │                        │
       │ │ │  [UPI] [Card]  │ │ │     6. User pays       │                        │
       │ │ │                │ │ │        via UPI/Card    │                        │
       │ │ └────────────────┘ │ │                        │                        │
       │ └────────────────────┘ │                        │                        │
       │                        │                        │                        │
       │<────────────────────────────────────────────────│                        │
       │ 7. Payment Success     │                        │                        │
       │    Callback            │                        │                        │
       │ {payment_id,           │                        │                        │
       │  subscription_id,      │                        │                        │
       │  signature}            │                        │                        │
       │                        │                        │                        │
       │  ══════════════════════════════════════════════════════════════════════  │
       │                    PHASE 3: VERIFY PAYMENT                               │
       │  ══════════════════════════════════════════════════════════════════════  │
       │                        │                        │                        │
       │ 8. Send verification   │                        │                        │
       │────────────────────────>                        │                        │
       │ POST /subscription/verify                       │                        │
       │ {payment_id,           │                        │                        │
       │  subscription_id,      │                        │                        │
       │  signature}            │                        │                        │
       │                        │                        │                        │
       │                        │ 9. Verify signature    │                        │
       │                        │ HMAC-SHA256(           │                        │
       │                        │   payment_id + "|" +   │                        │
       │                        │   subscription_id,     │                        │
       │                        │   key_secret           │                        │
       │                        │ ) === signature?       │                        │
       │                        │                        │                        │
       │<───────────────────────│                        │                        │
       │ {verified: true}       │                        │                        │
       │                        │                        │                        │
       │ 10. Show success UI    │                        │                        │
       │     to user            │                        │                        │
       │                        │                        │                        │
       │  ══════════════════════════════════════════════════════════════════════  │
       │                    PHASE 4: WEBHOOK (ASYNC)                              │
       │  ══════════════════════════════════════════════════════════════════════  │
       │                        │                        │                        │
       │                        │<───────────────────────│                        │
       │                        │ 11. Webhook POST       │                        │
       │                        │ event: subscription    │                        │
       │                        │        .activated      │                        │
       │                        │                        │                        │
       │                        │ 12. Validate webhook   │                        │
       │                        │     signature          │                        │
       │                        │                        │                        │
       │                        │ 13. Update payment     │                        │
       │                        │     status             │                        │
       │                        │────────────────────────────────────────────────>│
       │                        │                        │   status: "completed"  │
       │                        │                        │                        │
       │                        │ 14. Activate plan      │                        │
       │                        │────────────────────────────────────────────────>│
       │                        │                        │   Owner.planId =       │
       │                        │                        │     "owner_pro"        │
       │                        │                        │   planExpiresAt = +30d │
       │                        │                        │                        │
       │                        │ 15. Send push          │                        │
       │                        │     notification       │                        │
       │<·······················│                        │                        │
       │ 🎉 "Pro Plan Active!"  │                        │                        │
       │                        │                        │                        │
