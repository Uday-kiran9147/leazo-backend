name: Deploy Backend to EC2

on:
  push:
    branches: [master]

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"
          cache-dependency-path: "package.json"

      - name: Create Service Account File from Secret
        run: |
          if [ -n "${{ secrets.SERVICE_ACCOUNTS_JSON }}" ]; then
            echo "${{ secrets.SERVICE_ACCOUNTS_JSON }}" | base64 --decode > service_account.json || echo "${{ secrets.SERVICE_ACCOUNTS_JSON }}" > service_account.json
          else
            echo "{}" > service_account.json
          fi

      - name: Create .env.production file from Secret
        run: |
          if [ -n "${{ secrets.ENV_FILE_B64 }}" ]; then
            echo "${{ secrets.ENV_FILE_B64 }}" | base64 --decode > .env.production || echo "${{ secrets.ENV_FILE_B64 }}" > .env.production
          else
            cp .env.sample .env.production 2>/dev/null || touch .env.production
          fi

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r dist deploy/
          cp package*.json deploy/
          cp ecosystem.config.cjs deploy/
          cp service_account.json deploy/
          cp .env.production deploy/
          tar -czf deploy.tar.gz -C deploy .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deploy.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf "%s\n" "$SSH_PRIVATE_KEY" > leazo-key-pair.pem
          chmod 600 leazo-key-pair.pem

          scp -i leazo-key-pair.pem -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 deploy.tar.gz ${EC2_USERNAME}@${EC2_HOST}:/tmp/

          ssh -i leazo-key-pair.pem -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 ${EC2_USERNAME}@${EC2_HOST} << 'EOF'
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          export PATH="$PATH:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:/usr/local/bin:/usr/bin:/bin"

          APP_DIR="/home/ubuntu/leazo-backend"
          mkdir -p "$APP_DIR"
          cd "$APP_DIR"

          if [ -d "dist" ]; then
            timestamp=$(date +%Y%m%d_%H%M%S)
            mkdir -p backups
            tar -czf backups/backup_${timestamp}.tar.gz dist package.json ecosystem.config.cjs .env.production 2>/dev/null || true
            rm -f .env
            ls -t backups/backup_*.tar.gz | tail -n +6 | xargs -r rm
          fi

          tar --overwrite -xzf /tmp/deploy.tar.gz -C "$APP_DIR"
          rm -f /tmp/deploy.tar.gz

          npm install --include=dev

          mkdir -p logs

          if command -v pm2 >/dev/null 2>&1; then
            pm2 startOrReload ecosystem.config.cjs --env production --update-env || pm2 start ecosystem.config.cjs --env production
            pm2 save
          else
            echo "PM2 is not installed globally on server. Installing or starting node directly..."
            npm install -g pm2 2>/dev/null || true
            pm2 startOrReload ecosystem.config.cjs --env production --update-env || pm2 start ecosystem.config.cjs --env production
            pm2 save
          fi
          EOF
          rm -f leazo-key-pair.pem
