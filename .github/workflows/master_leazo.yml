name: Deploy Backend to EC2

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leazo-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: leazo-backend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: leazo-backend/package-lock.json

      - name: Create Service Account File from Secret
        run: echo "${{ secrets.SERVICE_ACCOUNTS_JSON }}" | base64 --decode > service_account.json

      - name: Create .env.production file from Secret
        run: echo "${{ secrets.ENV_FILE_B64 }}" | base64 --decode > .env.production

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r dist deploy/
          cp package*.json deploy/
          cp ecosystem.config.cjs deploy/
          cp service_account.json deploy/
          cp .env.production deploy/
          tar -czf ../deploy.tar.gz -C deploy .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deploy.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > locaura.pem
          chmod 600 locaura.pem

          scp -i locaura.pem -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 deploy.tar.gz ${EC2_USERNAME}@${EC2_HOST}:/tmp/

          ssh -i locaura.pem -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=10 ${EC2_USERNAME}@${EC2_HOST} << 'EOF'
            APP_DIR="/home/ubuntu/locaura-backend"
            mkdir -p $APP_DIR
            cd $APP_DIR

            if [ -d "dist" ]; then
              timestamp=$(date +%Y%m%d_%H%M%S)
              mkdir -p backups
              tar -czf backups/backup_${timestamp}.tar.gz dist package.json ecosystem.config.cjs .env.production 2>/dev/null || true
              rm -f .env
              ls -t backups/backup_*.tar.gz | tail -n +6 | xargs -r rm
            fi
            
            tar --overwrite -xzf /tmp/deploy.tar.gz -C $APP_DIR
            rm /tmp/deploy.tar.gz

            npm ci --omit=dev
            
            mkdir -p logs
            
            if pm2 describe locaura-backend > /dev/null 2>&1; then
              pm2 reload ecosystem.config.cjs --env production --update-env
            else
              pm2 start ecosystem.config.cjs --env production
            fi
            pm2 save
          EOF
          rm locaura.pem
